# =========================================================================================================
#                               【Important】
#  DO NOT EDIT config.tmpl.yml !!!
#  Copy and rename this file to config.yml as your configuration file.
#  Any changes to this file will be reverted.
#  -------------------------------------------------------------------------------------------------------
#                               【非常重要】
#  不要修改 config.tmpl.yml !!!
#  复制此文件并重命名为 config.yml 来作为你的配置文件
#  此文件的任何修改将会在服务器启动时被还原
# =========================================================================================================

# DO NOT EDIT
# 不要修改
version: 20

# 多国语言配置
# 可选项: en, zh, zh_cn, zh_tw, zh_hk
i18n:
  locale: zh


# =========================================================================================================
# 归属与数据存储
# ---------------------------------------------------------------------------------------------------------
# 假人归属、名称-UUID 映射、玩家特性、皮肤记录都保存在插件数据目录下的 data.yml。
# 不需要单独配置数据库；data.yml 是纯文本 YAML，可以直接备份/编辑。
# AuthMe 密码自动生成并保存在数据目录下的 secrets.yml，请勿把该文件公开。
# =========================================================================================================


# 服务器最多存在多少个假人
# 默认: 1000
server-limit: 1000


# 每个玩家最多创建多少个假人
# 默认: 1
player-limit: 1


# 如果启用, 则一个 IP 只能创建 `player-limit` 个假人
detect-ip: true


# 假人存活时间, 0 表示永久
# 单位: 分钟
lifespan: 0


# 假人在 Tab 上的名称样式
# Options:
#   black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray,
#   dark_gray, blue, green, aqua, red, light_purple, yellow, white
#   obfuscated, bold, strikethrough, underlined, italic
name-style: gray, italic


# 防止假人被其他插件踢掉
# 可选项:
#   NEVER: 不进行任何处理
#   ON_SPAWNING: 创建时防止被踢出
#   ALWAYS: 永远, 除了本插件以外任何插件包括 /kick 命令都无法将假人踢掉
prevent-kicking: ON_SPAWNING


# 跟随下线
# 假人创建者下线时是否也跟着下线
# 如果玩家只是切换服务器, 那么不会触发跟随下线
follow-quiting: true


# 是否保存假人存档
# 注意: 假人只保留快捷栏和副手物品, 背包和盔甲栏会在运行期间被持续清空
persist-data: true


# 死亡时是否踢出游戏, 如果设置为 false, 那么玩家可以通过 /fp respawn 命令重生
kick-on-dead: true


# 服务器最近 5 分钟平均 TPS 低于这个值清除所有假人
# 每 60 秒检测一次
# 默认: 0, 即不开启
kale-tps: 0


# Pre-Spawn-Commands
# 服务器会在假人创建前执行这些命令
# 变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
pre-spawn-commands: []


# Post-Spawn-Commands
# 服务器会在假人正在加入游戏中执行这些命令 (PlayerJoinEvent)
# 变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
post-spawn-commands: []


# After-Spawn-Commands
# 服务器会在假人创建后执行这些命令 (PlayerJoinEvent 之后)
# 变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
after-spawn-commands: []


# Self-Commands
# 假人在加入游戏后会以假人自己的身份执行以下命令
# 可用变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
#   %password%: 插件自动生成并保存在 secrets.yml 中的 AuthMe 密码
# 如果使用 AuthMe, 推荐直接使用下方的 authme 配置
self-commands: []


# Post-Quit-Commands
# 服务器会在假人正在退出时执行这些命令 (PlayerQuitEvent, 假人还在线)
# 变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
post-quit-commands: []


# After-Quit-Commands
# 服务器会在假人退出游戏之后执行这些命令 (PlayerQuitEvent 之后)
# 变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
after-quit-commands: []


# =========================================================================================================
# AuthMe 自动注册/登录
# ---------------------------------------------------------------------------------------------------------
# 假人加入后会先以自身身份执行 register-commands, 再延迟 1 秒执行 login-commands,
# 最后执行 self-commands。
# 仅当服务器安装了 AuthMe 且 authme.enabled 为 true 时生效。
#
# %password% 由插件随机生成 (20 位字母数字), 保存在 data 目录的 secrets.yml。
# 该密码不会输出给玩家, 也不会写入日志。
#
# 如果你的 AuthMe 使用了不同的注册/登录指令别名, 请修改下面的命令。
# =========================================================================================================
authme:
  enabled: true
  register-commands:
    - 'register %password% %password%'
  login-commands:
    - 'login %password%'


# =========================================================================================================
# 计时扣费
# ---------------------------------------------------------------------------------------------------------
# 每个假人独立计算：从假人创建开始, 每存活 interval-minutes 分钟,
# 插件以控制台身份执行一次 commands 中的命令。
#
# 可用变量:
#   %p: 假人的名称
#   %u: 假人的 UUID
#   %c: 创建人的名称
#   %id%: 假人的名称
#   %owner%: 创建人的名称
#   %owner_uuid%: 创建人的 UUID
#
# 如果服务器安装了 PlaceholderAPI, 命令中的 PAPI 变量也会被解析。
#
# 示例: 每个假人每小时扣除创建者 100 点券
#   charging:
#     enabled: true
#     interval-minutes: 60
#     commands:
#       - 'pointsapi:points remove %c 100'
# =========================================================================================================
charging:
  enabled: false
  # 支持小数, 例如 0.5 表示 30 秒
  interval-minutes: 60
  commands:
    - 'pointsapi:points remove %c 100'


# 默认假人特性
# 当玩家没有通过 /fp config 更改过配置或者他没有权限时生效
default-features:
  collidable: true
  skin: true
  look_at_entity: false
  invulnerable: false


# 检测更新
# 定制版本建议关闭, 因为检查的是上游项目
check-for-updates: false


# 开发者调试模式
debug: false
